name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend-verify:
    name: Frontend Lint, Typecheck, Test & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install dependencies using clean install
        working-directory: desktop
        run: npm ci

      - name: TypeScript strict validation
        working-directory: desktop
        run: npm run typecheck

      - name: ESLint static analysis
        working-directory: desktop
        run: npm run lint

      - name: Run Vitest unit & component tests
        working-directory: desktop
        run: npm test

      - name: Verify production Vite bundling
        working-directory: desktop
        run: npm run build
